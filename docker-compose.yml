services:
  vommeal:
    build: .
    container_name: vommeal
    restart: unless-stopped
    ports:
      # Exposed on LAN + Tailscale interfaces at <nas-ip>:3333.
      # If you later put a reverse proxy in front, change this to
      # "127.0.0.1:3333:3000" so the container is only reachable via the proxy.
      - "3333:3000"
    volumes:
      # Synology bind mount: the SQLite database is stored in this visible folder
      # so it is easy to inspect, back up, and restore from File Station.
      # Daily automatic backups are written to the backups/ subfolder
      # (vommeal-YYYY-MM-DD.db, 14 days retained) — see README "Backup".
      # On other hosts set DATA_PATH (e.g. ./data or /srv/vommeal/data).
      - ${DATA_PATH:-/volume1/docker/vommeal/data}:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # Container time zone (daily backup file names, logs). Reminder times use
      # the time zone from Vommeal Settings, which defaults to the same value.
      - TZ=${TZ:-Europe/Copenhagen}
      # Optional: set these in Portainer's stack environment variables.
      # If left empty, configure them later in Vommeal Settings.
      - MEALIE_URL=${MEALIE_URL:-}
      - MEALIE_TOKEN=${MEALIE_TOKEN:-}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
      - HA_ENTITY=${HA_ENTITY:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    # Pinned to a 172.x subnet on purpose: when Docker's 172.17–172.31 pool is
    # exhausted it falls back to 192.168.x.0/20, which the Synology firewall
    # and routing did not let out of the container (Mealie/HA became
    # unreachable). Pick another free /24 if this one collides on your host.
    ipam:
      config:
        - subnet: 172.26.0.0/24
